<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
<defs>
  <linearGradient id="rpBlue" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0040FF"/><stop offset="50%" stop-color="#0088FF"/><stop offset="100%" stop-color="#00E5FF"/></linearGradient>
  <linearGradient id="rpWhite" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#C0C8D0"/></linearGradient>
  <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#001A66"/><stop offset="30%" stop-color="#0066FF"/><stop offset="70%" stop-color="#00D4FF"/><stop offset="100%" stop-color="#00E5FF"/></linearGradient>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
</defs>
<rect width="500" height="500" rx="250" fill="#000000"/>
<!-- outer glow ring -->
<circle cx="250" cy="235" r="205" fill="none" stroke="url(#ringGrad)" stroke-width="4" stroke-linecap="round" opacity="0.95" stroke-dasharray="920 40 180 30" transform="rotate(-12 250 235)" filter="url(#glow)"/>
<!-- RP Monogram -->
<!-- R white -->
<path d="M 85 125 L 175 125 Q 270 125 270 195 Q 270 255 210 270 L 275 400 L 210 400 L 150 282 L 125 282 L 210 270 Q 235 262 235 195 Q 235 150 175 150 L 110 150 L 85 125 Z M 112 285 L 170 285 L 215 400 L 160 400 Z" fill="url(#rpWhite)"/>
<!-- P blue with notch for R -->
<path d="M 268 125 L 365 125 Q 445 125 445 200 Q 445 280 365 280 L 290 280 L 290 402 L 252 402 L 252 255 L 365 255 Q 405 255 405 200 Q 405 152 365 152 L 268 125 Z" fill="url(#rpBlue)"/>
<!-- code inside P -->
<text x="348" y="215" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="38" font-weight="700" fill="#00E5FF" letter-spacing="2">&lt;/&gt;</text>
<!-- slash highlight -->
<text x="348" y="215" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="38" font-weight="700" fill="#00E5FF" letter-spacing="2" opacity="0">/</text>
<!-- RISHIKESH PAL -->
<text x="250" y="452" text-anchor="middle" font-family="'Inter', sans-serif" font-size="24" font-weight="700" letter-spacing="10" fill="white">RISHIKESH<tspan fill="#00B7FF"> PAL</tspan></text>
<text x="250" y="476" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="500" letter-spacing="6" fill="#8A9199">BUILD<tspan fill="#00E5FF">  •  </tspan>LEARN<tspan fill="#00E5FF">  •  </tspan>GROW</text>
<rect x="185" y="490" width="130" height="3" rx="1.5" fill="url(#ringGrad)"/>
</svg>